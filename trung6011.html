<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call - Trung</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 15px; width: 60%; max-width: 250px; margin-bottom: 10px; }
        button { padding: 10px 15px; font-size: 15px; cursor: pointer; color: white; border: none; border-radius: 5px; margin: 5px; }
        .btn-primary { background-color: #007bff; } .btn-success { background-color: #28a745; } .btn-danger { background-color: #dc3545; } .btn-secondary { background-color: #6c757d; }
        .controls { margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 8px; display: inline-block; }
        .search-container { position: relative; display: inline-block; width: 100%; }
        .suggestions-box { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 60%; max-width: 250px; background: white; border: 1px solid #ddd; display: none; z-index: 10; text-align: left; }
        .suggestion-item { padding: 10px; cursor: pointer; } .suggestion-item:hover { background-color: #e9ecef; }
        .video-container { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        video { width: 45%; min-width: 280px; background: #111; border-radius: 8px; border: 2px solid #ddd; }
        #incomingCallUI { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 20px; border-radius: 10px; border: 2px solid #007bff; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Xin chào, Trung (trung6011)</h2>
        <p id="status" style="color: orange;">Đang tải Camera và kết nối máy chủ...</p>
        
        <div id="callSection" style="display: none;">
            <div class="search-container">
                <input type="text" id="remoteIdInput" placeholder="Tìm ID người gọi..." oninput="onSearchInput()">
                <div id="suggestions" class="suggestions-box"></div>
            </div>
            <div>
                <button class="btn-primary" onclick="makeCall('audio')">📞 Chỉ gọi</button>
                <button class="btn-success" onclick="makeCall('video')">📹 Gọi Video</button>
                <button class="btn-danger" onclick="endCall()" style="display:none;" id="endCallBtn">❌ Kết thúc</button>
            </div>
            <div class="controls">
                <button class="btn-secondary" id="micBtn" onclick="toggleMic()">🎤 Tắt Mic</button>
                <button class="btn-secondary" id="camBtn" onclick="toggleVideo()">📷 Tắt Cam</button>
                <button class="btn-secondary" onclick="switchCamera()">🔄 Đổi Cam Sau</button>
            </div>
            <div class="video-container">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
    </div>
    
    <div id="incomingCallUI">
        <h3 id="callerName">Cuộc gọi đến...</h3>
        <button class="btn-primary" onclick="acceptCall('audio')">📞 Trả lời (Chỉ Mic)</button>
        <button class="btn-success" onclick="acceptCall('video')">📹 Trả lời (Có Video)</button>
        <button class="btn-danger" onclick="rejectCall()">❌ Từ chối</button>
    </div>
    <audio id="ringtone" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" loop></audio>

    <script>
        const myId = 'trung6011'; 
        const otherIDs = ['tue12345', 'demo12345']; 

        let peer, localStream, currentCall, incomingCall;
        let isMicOn = true, isCamOn = true, currentFacingMode = 'user';

        const localVideo = document.getElementById('localVideo'), remoteVideo = document.getElementById('remoteVideo'), ringtone = document.getElementById('ringtone'), remoteInput = document.getElementById('remoteIdInput'), suggestionsBox = document.getElementById('suggestions'), statusText = document.getElementById('status'), callSection = document.getElementById('callSection');

        window.addEventListener('load', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
                localVideo.srcObject = localStream;
                peer = new Peer(myId);
                peer.on('open', (id) => { statusText.innerText = '✅ Đã sẵn sàng!'; statusText.style.color = 'green'; callSection.style.display = 'block'; });
                peer.on('call', (call) => {
                    incomingCall = call; document.getElementById('callerName').innerText = call.peer + " đang gọi!";
                    document.getElementById('incomingCallUI').style.display = 'block'; 
                    ringtone.play().catch(e => console.log("Trình duyệt chặn autoplay chuông."));
                });
                peer.on('error', (err) => { statusText.innerText = 'Lỗi: ' + err.type; statusText.style.color = 'red'; });
            } catch (err) { statusText.innerText = "❌ Lỗi: Vui lòng cấp quyền Camera/Micro!"; statusText.style.color = 'red'; }
        });

        function updateBtnUI(id, isOn, onText, offText) {
            const btn = document.getElementById(id); btn.innerText = isOn ? offText : onText; btn.style.backgroundColor = isOn ? '#6c757d' : '#dc3545';
        }
        function toggleMic() { if (!localStream) return; isMicOn = !isMicOn; localStream.getAudioTracks()[0].enabled = isMicOn; updateBtnUI('micBtn', isMicOn, '🔇 Bật Mic', '🎤 Tắt Mic'); }
        function toggleVideo() { if (!localStream) return; isCamOn = !isCamOn; localStream.getVideoTracks()[0].enabled = isCamOn; updateBtnUI('camBtn', isCamOn, '🚫 Bật Cam', '📷 Tắt Cam'); }
        
        async function switchCamera() {
            if (!localStream) return;
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            const oldTrack = localStream.getVideoTracks()[0]; oldTrack.stop();
            try {
                const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                const newTrack = newStream.getVideoTracks()[0]; newTrack.enabled = isCamOn;
                localStream.removeTrack(oldTrack); localStream.addTrack(newTrack); localVideo.srcObject = localStream;
                if (currentCall && currentCall.peerConnection) {
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(newTrack);
                }
            } catch (err) { alert("Thiết bị không có Camera sau!"); currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; }
        }

        function onSearchInput() {
            const query = remoteInput.value.toLowerCase().trim(); suggestionsBox.innerHTML = '';
            if (!query) { suggestionsBox.style.display = 'none'; return; }
            const matches = otherIDs.filter(id => id.toLowerCase().includes(query));
            if (matches.length > 0) {
                matches.forEach(id => {
                    const item = document.createElement('div'); item.className = 'suggestion-item'; item.innerText = id;
                    item.onclick = () => { remoteInput.value = id; suggestionsBox.style.display = 'none'; }; suggestionsBox.appendChild(item);
                }); suggestionsBox.style.display = 'block';
            } else { suggestionsBox.style.display = 'none'; }
        }

        function makeCall(type) { 
            const remoteId = remoteInput.value.trim(); if (!remoteId || !localStream) return; 
            isCamOn = (type === 'video'); localStream.getVideoTracks()[0].enabled = isCamOn; updateBtnUI('camBtn', isCamOn, '🚫 Bật Cam', '📷 Tắt Cam');
            currentCall = peer.call(remoteId, localStream); handleEvents(currentCall); 
        }
        function acceptCall(type) { 
            document.getElementById('incomingCallUI').style.display = 'none'; ringtone.pause(); ringtone.currentTime = 0; 
            if (incomingCall && localStream) { 
                isCamOn = (type === 'video'); localStream.getVideoTracks()[0].enabled = isCamOn; updateBtnUI('camBtn', isCamOn, '🚫 Bật Cam', '📷 Tắt Cam');
                currentCall = incomingCall; currentCall.answer(localStream); handleEvents(currentCall); 
            } 
        }
        function rejectCall() { document.getElementById('incomingCallUI').style.display = 'none'; ringtone.pause(); ringtone.currentTime = 0; if (incomingCall) { incomingCall.close(); incomingCall = null; } }
        function endCall() { if (currentCall) currentCall.close(); remoteVideo.srcObject = null; document.getElementById('endCallBtn').style.display = 'none'; }
        function handleEvents(call) { document.getElementById('endCallBtn').style.display = 'inline-block'; call.on('stream', stream => { remoteVideo.srcObject = stream; }); call.on('close', () => { remoteVideo.srcObject = null; document.getElementById('endCallBtn').style.display = 'none'; }); }
    </script>
</body>
</html>
